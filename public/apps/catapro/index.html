<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CataPro — OraBox Shopify Studio</title>
  <meta name="description" content="AI images to Shopify products." />
  <style>
    :root {
      --bg0: #0c1210;
      --bg1: #15201a;
      --fg: #eef6f1;
      --muted: #8fa89a;
      --accent: #3dd68c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--fg);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(800px 420px at 80% -10%, #1e3a2c 0%, transparent 55%),
        linear-gradient(165deg, var(--bg1), var(--bg0));
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(2.5rem, 10vh, 6rem) 1.5rem 3rem;
    }
    a.home { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    a.home:hover { color: var(--accent); }
    h1 {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      letter-spacing: -0.03em;
      margin: 1rem 0 0.6rem;
    }
    p { color: var(--muted); line-height: 1.55; max-width: 34rem; }
    .cta {
      display: inline-block;
      margin-top: 1.25rem;
      margin-right: 0.75rem;
      padding: 0.7rem 1.1rem;
      border-radius: 6px;
      background: var(--accent);
      color: #062822;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <a class="home" href="/">OraBox Shopify Studio</a>
    <h1>CataPro</h1>
    <p>AI images to Shopify products.</p>
    <a class="cta" href="/privacy/catapro/">Privacy</a>
  </main>
</body>
</html>
